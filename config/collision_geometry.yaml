#  Tipus:
#    cylinder = cilindre pla (tapes planes)
#    box      = caixa orientada
#    sphere   = esfera

primitives:

#  BASE_LINK

# 2000 x 2000 x 10 mm. La col·loquem centrada a l'origen, amb la
# superficie superior a Z=0. Aixi qualsevol link amb Z<0 col·lisiona
# amb la taula. El robot esta al damunt.
- link: base_link
  type: box
  center: [0.0, 0.0, -0.005]
  size: [2.0, 2.0, 0.01]
  rpy: [0.0, 0.0, 0.0]

# DISC BASE del robot (sobre la taula)
- link: base_link
  type: cylinder
  p0: [0.0, 0.0, 0.0]
  p1: [0.0, 0.0, 0.0098]
  radius: 0.0333


